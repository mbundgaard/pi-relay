name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11
      - name: Verify release tag and package identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (pkg.name !== '@comput/pi-relay') throw new Error('Unexpected package name');
          if (process.env.RELEASE_TAG !== `v${pkg.version}`) {
            throw new Error(`Release tag must be v${pkg.version}`);
          }
          if (pkg.private) throw new Error('Package is marked private');
          NODE
      - run: npm ci
      - run: npm run check
      - run: npm pack --dry-run
      - name: Publish using GitHub OIDC
        run: npm publish --access public --provenance
